[project]
name = "flakehunter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pytest>=7.0",
    "pytest-json-report>=1.5",
    "pytest-randomly>=3.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
flakehunter = "flakehunter.cli:main"

[tool.setuptools.package-data]
flakehunter = ["static/*"]

[tool.setuptools.packages.find]
include = ["flakehunter*"]

[tool.pytest.ini_options]
norecursedirs = ["demo_originals", ".git", "reports", "*.egg-info"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
